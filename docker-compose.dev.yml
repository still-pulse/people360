version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gestaorh-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestaorh
      POSTGRES_USER: gestaorh
      POSTGRES_PASSWORD: gestaorh123
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestaorh -d gestaorh"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
